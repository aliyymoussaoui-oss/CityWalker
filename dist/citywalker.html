    if (!s || !cfg.url) return;
    try {
      await fetch(`${cfg.url}/auth/v1/logout`, {
        method: 'POST',
        headers: { apikey: cfg.key, authorization: `Bearer ${s.accessToken}` },
      });
    } catch (_) { /* la session locale est déjà effacée, c'est l'essentiel */ }
  }

  // ------------------------------------------------------------- requêtes

  async function api(path, opts, retry) {
    const cfg = loadConfig();
    let s = loadSession();
    if (!s) throw new Error('Pas connecté.');
    if (s.expiresAt - Date.now() < 60000) s = (await refresh()) || s;
    const headers = Object.assign({
      apikey: cfg.key,
      authorization: `Bearer ${s.accessToken}`,
    }, (opts && opts.headers) || {});
    const res = await fetch(`${cfg.url}${path}`, Object.assign({}, opts, { headers }));
    if (res.status === 401 && !retry) {
      if (await refresh()) return api(path, opts, true);
      clearSession();
      throw new Error('Session expirée, reconnecte-toi.');
    }
    if (!res.ok) throw await readError(res, 'Requête refusée');
    return res;
  }

  const jsonHeaders = { 'content-type': 'application/json', accept: 'application/json' };

  async function pullCity(cityId) {
    const res = await api(`/rest/v1/progress?select=data,updated_at&city=eq.${encodeURIComponent(cityId)}`,
      { method: 'GET', headers: jsonHeaders });
    const rows = await res.json();
    if (!Array.isArray(rows) || !rows.length) return null;
    return CW.normalizeProgress(rows[0].data, cityId);
  }

  async function pushCity(cityId, progress) {
    const s = loadSession();
    await api('/rest/v1/progress', {
      method: 'POST',
      headers: Object.assign({}, jsonHeaders, { prefer: 'resolution=merge-duplicates,return=minimal' }),
      body: JSON.stringify([{ user_id: s.userId, city: cityId, data: progress, updated_at: new Date().toISOString() }]),
    });
  }

  async function listPhotos() {
    const res = await api('/rest/v1/photos?select=id,city,spot,w,h,taken_at,created_at',
      { method: 'GET', headers: jsonHeaders });
    const rows = await res.json();
    return Array.isArray(rows) ? rows : [];
  }

  const photoPath = (userId, id) => `${userId}/${id}.jpg`;

  async function uploadPhoto(record) {
    const s = loadSession();
    await api(`/storage/v1/object/${BUCKET}/${photoPath(s.userId, record.id)}`, {
      method: 'POST',
      headers: { 'content-type': 'image/jpeg', 'x-upsert': 'true' },
      body: record.full,
    });
    await api('/rest/v1/photos', {
      method: 'POST',
      headers: Object.assign({}, jsonHeaders, { prefer: 'resolution=merge-duplicates,return=minimal' }),
      body: JSON.stringify([{
        id: record.id, user_id: s.userId, city: record.city, spot: record.spot,
        w: record.w || 0, h: record.h || 0, taken_at: record.takenAt || '',
        created_at: record.createdAt || Date.now(),
      }]),
    });
  }

  async function downloadPhoto(row) {
    const s = loadSession();
    const res = await api(`/storage/v1/object/${BUCKET}/${photoPath(s.userId, row.id)}`, { method: 'GET' });
    return res.blob();
  }

  // ---------------------------------------------------------- orchestration

  /**
   * Synchronise dans les deux sens. La fusion ne retire jamais rien :
   * en cas de divergence entre deux appareils, l'union gagne.
   */
  async function sync(cityIds, onProgress) {
    const report = { cities: 0, merged: 0, uploaded: 0, downloaded: 0 };
    const step = (t) => { if (onProgress) onProgress(t); };

    for (const cityId of cityIds) {
      step(`Synchronisation de ${cityId}…`);
      const local = CW.store.loadProgress(cityId);
      const remote = await pullCity(cityId);
      let merged = local;
      if (remote) {
        const res = CW.mergeProgress(local, remote);
        merged = res.progress;
        report.merged += res.changed;
        CW.store.replaceProgress(cityId, merged);
      }
      await pushCity(cityId, merged);
      report.cities++;
    }

    step('Comparaison des photos…');
    const remotePhotos = await listPhotos();
    const remoteIds = new Set(remotePhotos.map((r) => r.id));
    for (const cityId of cityIds) {
      const localRows = await CW.store.photosForCity(cityId);
      const localIds = new Set(localRows.map((r) => r.id));
      for (const row of localRows) {
        if (remoteIds.has(row.id)) continue;
        step(`Envoi des photos… (${report.uploaded + 1})`);
        await uploadPhoto(row);
        report.uploaded++;
      }
      for (const row of remotePhotos) {
        if (row.city !== cityId || localIds.has(row.id)) continue;
        step(`Réception des photos… (${report.downloaded + 1})`);
        const blob = await downloadPhoto(row);
        await CW.store.putPhoto({
          id: row.id, city: row.city, spot: row.spot, w: row.w || 0, h: row.h || 0,
          takenAt: row.taken_at || '', caption: '', createdAt: row.created_at || Date.now(),
          full: blob, thumb: blob,
        });
        const entry = CW.store.ensureEntry(row.city, row.spot);
        if (!entry.photos.includes(row.id)) {
          CW.store.updateEntry(row.city, row.spot, { photos: entry.photos.concat([row.id]), done: true });
        }
        report.downloaded++;
      }
    }
    CW.store.flushAll();
    writeJSON('citywalker:v1:last-sync', Date.now());
    return report;
  }

  const lastSync = () => readJSON('citywalker:v1:last-sync', 0);

  CW.cloud = {
    loadConfig, setConfig, configured, cleanUrl, isBaked,
    session: loadSession, signUp, signIn, signOut, refresh,
    resetPassword, magicLink, adoptSessionFromHash,
    pullCity, pushCity, listPhotos, uploadPhoto, downloadPhoto, sync, lastSync,
  };
})();

/* ---- share.js ---- */
/* CityWalker — partage : lien en lecture seule, export / import de sauvegarde, fusion. */
(function () {
  'use strict';
  const CW = window.CW;

  const LINK_PREFIX = 'cw1';          // version du format de lien

  // ------------------------------------------------------------ compression

  async function deflate(bytes) {
    if (typeof CompressionStream !== 'function') return null;
    try {
      const cs = new CompressionStream('deflate-raw');
      const stream = new Blob([bytes]).stream().pipeThrough(cs);
      return new Uint8Array(await new Response(stream).arrayBuffer());
    } catch (_) {
      return null;
    }
  }
  async function inflate(bytes) {
    if (typeof DecompressionStream !== 'function') {
      throw new Error("Ce navigateur ne sait pas lire les liens compressés — ouvre le lien avec un navigateur récent.");
    }
    const ds = new DecompressionStream('deflate-raw');
    const stream = new Blob([bytes]).stream().pipeThrough(ds);
    return new Uint8Array(await new Response(stream).arrayBuffer());
  }

  // ---------------------------------------------------------- lien de partage

  function tagsToBits(tags) {
    let bits = 0;
    for (const t of tags || []) {
      const i = CW.TAG_INDEX[t];
      if (i !== undefined) bits |= 1 << i;
    }
    return bits;
  }
  function bitsToTags(bits) {
    const out = [];
    for (let i = 0; i < CW.TAGS.length; i++) if (bits & (1 << i)) out.push(CW.TAGS[i].id);
    return out;
  }

  /** Charge utile compacte : uniquement ce qui est utile à la lecture. */
  function compactPayload(cityId, progress, opts) {
    const s = {};
    for (const id of Object.keys(progress.spots)) {
      const e = progress.spots[id];
      if (!CW.isDone(e) && !e.tags.length && !e.note) continue;
      const row = [CW.isDone(e) ? 1 : 0, tagsToBits(e.tags), e.photos.length, e.date || ''];
      if (opts && opts.notes && e.note) row.push(e.note);
      s[id] = row;
    }
    // Les lieux posés à la main voyagent aussi : c'est souvent le plus intéressant.
    const x = (progress.custom || []).map((c) => [c.id, c.name, c.cat, c.x, c.y, c.lat, c.lon, c.zone || '']);
    return { v: 1, c: cityId, o: (progress.owner || (opts && opts.owner) || '').slice(0, 40), t: progress.updatedAt || Date.now(), s, x };
  }

  /** Construit le fragment `#p=...` à coller après l'URL de l'application. */
  CW.encodeShare = async function encodeShare(cityId, progress, opts) {
    const json = JSON.stringify(compactPayload(cityId, progress, opts));
    const raw = new TextEncoder().encode(json);
    const packed = await deflate(raw);
    if (packed && packed.length < raw.length) return `${LINK_PREFIX}d.${CW.b64url.encode(packed)}`;
    return `${LINK_PREFIX}r.${CW.b64url.encode(raw)}`;
  };

  /** Décode un fragment de partage ; renvoie {city, owner, updatedAt, progress} ou lève. */
  CW.decodeShare = async function decodeShare(token) {
    const m = /^cw1([dr])\.([A-Za-z0-9_-]+)$/.exec(String(token || '').trim());
    if (!m) throw new Error('Lien de partage illisible.');
    let bytes = CW.b64url.decode(m[2]);
    if (m[1] === 'd') bytes = await inflate(bytes);
    let payload;
    try { payload = JSON.parse(new TextDecoder().decode(bytes)); } catch (_) { throw new Error('Lien de partage corrompu.'); }
    if (!payload || payload.v !== 1 || !CW.CITY_ORDER.includes(payload.c) || typeof payload.s !== 'object') {
      throw new Error('Lien de partage incompatible.');
    }
    const progress = CW.emptyProgress(payload.c);
    progress.owner = typeof payload.o === 'string' ? payload.o.slice(0, 40) : '';
    progress.updatedAt = Number.isFinite(payload.t) ? payload.t : 0;
    for (const id of Object.keys(payload.s)) {
      const row = payload.s[id];
      if (!Array.isArray(row)) continue;
      const entry = CW.emptyEntry();
      entry.done = row[0] === 1;
      entry.tags = bitsToTags(Number(row[1]) || 0);
      const count = Math.max(0, Math.min(999, Number(row[2]) || 0));
      // Les photos ne voyagent pas dans le lien : on garde seulement leur nombre.
      entry.photos = [];
      entry.photoCount = count;
      entry.date = typeof row[3] === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(row[3]) ? row[3] : '';
      entry.note = typeof row[4] === 'string' ? row[4].slice(0, 2000) : '';
      progress.spots[id] = entry;
    }
    if (Array.isArray(payload.x)) {
      for (const row of payload.x.slice(0, 500)) {
        if (!Array.isArray(row)) continue;
        const c = CW.normalizeCustom({ id: row[0], name: row[1], cat: row[2], x: row[3], y: row[4], lat: row[5], lon: row[6], zone: row[7] });
        if (c) progress.custom.push(c);
      }
    }
    return { city: payload.c, owner: progress.owner, updatedAt: progress.updatedAt, progress };
  };

  CW.shareURL = function shareURL(token) {
    const base = location.href.split('#')[0];
    return `${base}#p=${token}`;
  };

  CW.readShareFromLocation = function readShareFromLocation() {
    const h = location.hash || '';
    const m = /[#&]p=([^&]+)/.exec(h);
    return m ? decodeURIComponent(m[1]) : null;
  };

  // ------------------------------------------------------------ fusion

  /** Fusionne `theirs` dans `mine` (union : rien n'est jamais retiré). */
  CW.mergeProgress = function mergeProgress(mine, theirs) {
    const out = CW.normalizeProgress(mine, mine.city);
    let changed = 0;
    for (const id of Object.keys(theirs.spots || {})) {
      const t = theirs.spots[id];
      const m = out.spots[id] || CW.emptyEntry();
      const before = JSON.stringify(m);
      m.done = m.done || !!t.done || (t.photoCount > 0);
      m.tags = Array.from(new Set([...(m.tags || []), ...(t.tags || [])]));
      if (!m.date && t.date) m.date = t.date;
      if (t.note && !m.note) m.note = t.note;
      else if (t.note && m.note && !m.note.includes(t.note)) m.note = `${m.note}\n— ${t.note}`;
      m.photos = Array.from(new Set([...(m.photos || []), ...(t.photos || [])]));
      m.rating = Math.max(m.rating || 0, t.rating || 0);
      if (JSON.stringify(m) !== before) changed++;
      out.spots[id] = m;
    }
    const known = new Set(out.custom.map((c) => c.id));
    for (const c of theirs.custom || []) {
      if (known.has(c.id)) continue;
      const clean = CW.normalizeCustom(c);
      if (clean) { out.custom.push(clean); known.add(clean.id); changed++; }
    }
    if (!out.owner && theirs.owner) out.owner = theirs.owner;
    return { progress: out, changed };
  };

  // ------------------------------------------------------- export / import

  /** Sauvegarde complète (progression + photos) d'une ou plusieurs villes. */
  CW.exportBundle = async function exportBundle(cityIds, onProgress) {
    const bundle = { app: 'citywalker', v: 1, exportedAt: new Date().toISOString(), cities: {}, photos: [] };
    let n = 0;
    for (const cityId of cityIds) {
      bundle.cities[cityId] = CW.store.loadProgress(cityId);
      const rows = await CW.store.photosForCity(cityId);
      for (const r of rows) {
        bundle.photos.push({
          id: r.id, city: r.city, spot: r.spot, w: r.w, h: r.h,
          takenAt: r.takenAt || '', caption: r.caption || '', createdAt: r.createdAt || 0,
          full: await CW.blobToDataURL(r.full),
          thumb: r.thumb ? await CW.blobToDataURL(r.thumb) : '',
        });
        n++;
        if (onProgress) onProgress(n);
      }
    }
    return bundle;
  };

  /** Lit et valide un fichier de sauvegarde. */
  CW.parseBundle = async function parseBundle(file) {
    const text = await CW.readFileAsText(file);
    let data;
    try { data = JSON.parse(text); } catch (_) { throw new Error("Ce fichier n'est pas une sauvegarde CityWalker."); }
    if (!data || data.app !== 'citywalker' || !data.cities || typeof data.cities !== 'object') {
      throw new Error("Ce fichier n'est pas une sauvegarde CityWalker.");
    }
    const cities = {};
    for (const id of Object.keys(data.cities)) {
      if (CW.CITY_ORDER.includes(id)) cities[id] = CW.normalizeProgress(data.cities[id], id);
    }
    const photos = Array.isArray(data.photos) ? data.photos.filter((p) => p && typeof p.id === 'string' && CW.CITY_ORDER.includes(p.city) && typeof p.spot === 'string' && typeof p.full === 'string') : [];
    return { cities, photos, exportedAt: data.exportedAt || '' };
  };

  /** Applique une sauvegarde : fusionne la progression, ajoute les photos manquantes. */
  CW.applyBundle = async function applyBundle(bundle, onProgress) {
    const report = { cities: 0, changed: 0, photosAdded: 0, photosSkipped: 0 };
    const seen = new Set();
    for (const cityId of Object.keys(bundle.cities)) {
      const mine = CW.store.loadProgress(cityId);
      const { progress, changed } = CW.mergeProgress(mine, bundle.cities[cityId]);
      CW.store.replaceProgress(cityId, progress);
      report.cities++;
      report.changed += changed;
    }
    let n = 0;
    for (const p of bundle.photos) {
      n++;
      if (onProgress) onProgress(n, bundle.photos.length);
      if (seen.has(p.id)) continue;
      seen.add(p.id);
      try {
        const existing = await CW.store.getPhoto(p.id);
        if (existing) { report.photosSkipped++; continue; }
        const full = CW.dataURLToBlob(p.full);
        const thumb = p.thumb ? CW.dataURLToBlob(p.thumb) : full;
        await CW.store.putPhoto({
          id: p.id, city: p.city, spot: p.spot, w: p.w || 0, h: p.h || 0,
          takenAt: p.takenAt || '', caption: p.caption || '', createdAt: p.createdAt || Date.now(),
          full, thumb,
        });
        const entry = CW.store.ensureEntry(p.city, p.spot);
        if (!entry.photos.includes(p.id)) entry.photos.push(p.id);
        entry.done = true;
        CW.store.saveProgress(p.city);
        report.photosAdded++;
      } catch (_) {
        report.photosSkipped++;
      }
    }
    CW.store.flushAll();
    return report;
  };

  CW._share = { tagsToBits, bitsToTags, compactPayload };
})();

/* ---- tiles.js ---- */
/* CityWalker — fond de carte détaillé (rues, noms) en tuiles raster.
 *
 * La carte vectorielle reste dessous et suffit à elle seule : les tuiles sont un
 * calque facultatif, qui demande le réseau. Si elles ne chargent pas — hors
 * ligne, réseau filtré, page embarquée — la carte sobre reste affichée telle
 * quelle, sans erreur ni trou.
 *
 * Aucune bibliothèque : la projection du build est déjà du Web Mercator, donc
 * la position d'une tuile dans le viewBox se calcule directement.
 */
(function () {
  'use strict';
  const CW = window.CW;

  const TILE = 256;
  const MAX_TILES = 260;          // garde-fou : au-delà, on baisse d'un niveau
  const MIN_Z = 10, MAX_Z = 18;

  /* `window.CW_TILE_SOURCES` permet de pointer vers un autre fournisseur — une
     instance auto-hébergée, ou un serveur de test. */
  const KEY = (window.CW_CONFIG && window.CW_CONFIG.cartoKey) || '';
  const SUFFIX = KEY ? `?key=${encodeURIComponent(KEY)}` : '';
  const CREDIT = '© OpenStreetMap · © CARTO';
  const carto = (style) => ({
    url: (z, x, y) => `https://basemaps.cartocdn.com/rastertiles/${style}/${z}/${x}/${y}.png${SUFFIX}`,
    credit: CREDIT,
  });

  const BUILTIN = {
    chaleureux: carto('voyager'),      // couleurs franches, relief, points d'intérêt
    sobre: carto('light_all'),         // gris pâle, pour laisser parler les épingles
    sombre: carto('dark_all'),
  };
  // `light` et `dark` restent les noms par défaut de la couche.
  BUILTIN.light = BUILTIN.chaleureux;
  BUILTIN.dark = BUILTIN.sombre;

  const SOURCES = window.CW_TILE_SOURCES || BUILTIN;

  class TileLayer {
    constructor(group) {
      this.group = group;
      this.city = null;
      this.enabled = false;
      this.variant = 'light';
      this.nodes = new Map();       // clé "z/x/y" -> <image>
      this.failures = 0;
      this.reported = false;
      this.onUnavailable = () => {};
    }

    setCity(city) {
      this.city = city;
      this.clear();
    }

    setEnabled(on) {
      this.enabled = !!on;
      this.group.style.display = this.enabled ? '' : 'none';
      if (!this.enabled) this.clear();
    }

    setVariant(variant) {
      const next = SOURCES[variant] ? variant : 'light';
      if (next === this.variant) return;
      this.variant = next;
      this.clear();
    }

    clear() {
      CW.clear(this.group);
      this.nodes.clear();
    }

    /** viewBox -> coordonnée monde [0,1] et retour. */
    _worldFromVB(vbX, vbY) {
      const pr = this.city.projection;
      const mx = (vbX - pr.pad) / pr.scale + pr.x0;
      const my = (vbY - pr.pad) / pr.scale + pr.y0;
      return { x: (mx / Math.PI + 1) / 2, y: (my / Math.PI + 1) / 2 };
    }
    _vbFromWorld(wx, wy) {
      const pr = this.city.projection;
      return {
        x: ((wx * 2 - 1) * Math.PI - pr.x0) * pr.scale + pr.pad,
        y: ((wy * 2 - 1) * Math.PI - pr.y0) * pr.scale + pr.pad,
      };
    }

    /**
     * Recalcule les tuiles visibles.
     * @param {{k:number,tx:number,ty:number}} t transformation de la scène
     * @param {number} fit facteur viewBox -> pixels écran
     */
    update(t, fit) {
      if (!this.enabled || !this.city) return;
      const view = this.city.view;
      const pr = this.city.projection;

      // Largeur du monde entier, en pixels écran, à l'échelle courante.
      const worldPx = 2 * Math.PI * pr.scale * t.k * (fit || 1);
      let z = Math.round(Math.log2(Math.max(1, worldPx) / TILE));
      z = CW.clamp(z, MIN_Z, MAX_Z);

      // Fenêtre visible, en coordonnées viewBox de la scène.
      const x0 = (0 - t.tx) / t.k, x1 = (view.w - t.tx) / t.k;
      const y0 = (0 - t.ty) / t.k, y1 = (view.h - t.ty) / t.k;
      const a = this._worldFromVB(x0, y0);
      const b = this._worldFromVB(x1, y1);

      let n = 1 << z;
      let i0, i1, j0, j1;
      // Si la fenêtre demande trop de tuiles, on recule d'un niveau.
      for (;;) {
        i0 = Math.floor(a.x * n); i1 = Math.floor(b.x * n);
        j0 = Math.floor(a.y * n); j1 = Math.floor(b.y * n);
        i0 = Math.max(0, i0); j0 = Math.max(0, j0);
        i1 = Math.min(n - 1, i1); j1 = Math.min(n - 1, j1);
        const count = (i1 - i0 + 1) * (j1 - j0 + 1);
        if (count <= MAX_TILES || z <= MIN_Z) break;
        z--; n = 1 << z;
      }
      if (i1 < i0 || j1 < j0) return;

      const wanted = new Set();
      const src = SOURCES[this.variant];
      for (let i = i0; i <= i1; i++) {
        for (let j = j0; j <= j1; j++) {
          const key = `${z}/${i}/${j}`;
          wanted.add(key);
          if (this.nodes.has(key)) continue;
          const p0 = this._vbFromWorld(i / n, j / n);
          const p1 = this._vbFromWorld((i + 1) / n, (j + 1) / n);
          const img = CW.svg('image', {
            x: p0.x, y: p0.y,
            width: Math.abs(p1.x - p0.x) + 0.6,     // léger recouvrement : pas de liseré
            height: Math.abs(p1.y - p0.y) + 0.6,
            href: src.url(z, i, j),
            class: 'tile',
            preserveAspectRatio: 'none',
          });
          img.addEventListener('error', () => {
            img.remove();
            this.nodes.delete(key);
            this.failures++;
            // Deux échecs suffisent à conclure que la source est inaccessible.
            if (this.failures >= 2 && !this.reported) {
              this.reported = true;
              this.onUnavailable();
            }
          });
          img.addEventListener('load', () => { img.classList.add('is-loaded'); });
          this.group.appendChild(img);
          this.nodes.set(key, img);
        }
      }

      // Les tuiles d'autres niveaux restent tant qu'elles couvrent l'écran ;
      // on ne retire que celles franchement hors champ.
      for (const [key, node] of this.nodes) {
        if (wanted.has(key)) continue;
        const [tz] = key.split('/').map(Number);
        if (tz !== z) { node.remove(); this.nodes.delete(key); }
        else if (!wanted.has(key)) { node.remove(); this.nodes.delete(key); }
      }
    }

    credit() { return SOURCES[this.variant].credit; }
  }

  CW.TileLayer = TileLayer;
})();

/* ---- map.js ---- */
/* CityWalker — carte vectorielle SVG : rendu, pan/zoom, épingles. */
(function () {
  'use strict';
  const CW = window.CW;

  const MIN_K = 0.85, MAX_K = 16;
  const PIN_D = 'M0 0C-5.5-6.5-8.5-10.5-8.5-14.5A8.5 8.5 0 1 1 8.5-14.5C8.5-10.5 5.5-6.5 0 0Z';

  class CityMap {
    constructor(svg, stage) {
      this.svg = svg;
      this.stage = stage;
      this.tooltip = document.getElementById('map-tooltip');
      this.city = null;
      this.getEntry = () => null;
      this.onSelect = () => {};
      this.onZone = () => {};
      this.onAddPoint = () => {};
      this.onTilesUnavailable = () => {};
      this.addMode = false;
      this.k = 1; this.tx = 0; this.ty = 0;
      this.selected = null;
      this.pins = new Map();
      this.pointers = new Map();
      this.drag = null;
      this.showLabels = true;
      this._bind();
    }

    load(city, spots) {
      this.city = city;
      this.selected = null;
      this.pins.clear();
      const { w, h } = city.view;
      const svg = this.svg;
      CW.clear(svg);
      svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
      svg.style.setProperty('--accent', city.accent);

      const defs = CW.svg('defs');
      const clip = CW.svg('clipPath', { id: 'cw-clip' }, CW.svg('path', { d: city.outline }));
      defs.appendChild(clip);
      svg.appendChild(defs);

      const scene = CW.svg('g', { class: 'scene' });
      this.scene = scene;
      // Pas de découpe ici : les communes voisines doivent rester visibles,
      // sinon les lieux « Alentours » flottent sur du vide.
      const tiles = CW.svg('g', { class: 'layer-tiles' });
      scene.appendChild(tiles);
      if (!this.tiles) {
        this.tiles = new CW.TileLayer(tiles);
        this.tiles.onUnavailable = () => this.onTilesUnavailable();
      } else {
        this.tiles.group = tiles;
      }
      this.tiles.setCity(city);
      // Teinte discrète au-delà de la commune : sans fond détaillé, les
      // alentours restent lisibles au lieu d'être une page blanche.
      scene.appendChild(CW.svg('rect', {
        x: -200, y: -200, width: w + 400, height: h + 400, class: 'beyond',
      }));
      const base = CW.svg('g', { class: 'layer-base', 'clip-path': 'url(#cw-clip)' });
      base.appendChild(CW.svg('rect', { x: -50, y: -50, width: w + 100, height: h + 100, class: 'land' }));
      const green = CW.svg('g', { class: 'layer-green' });
      for (const d of city.green) green.appendChild(CW.svg('path', { d }));
      base.appendChild(green);
      const water = CW.svg('g', { class: 'layer-water' });
      for (const d of city.water) water.appendChild(CW.svg('path', { d }));
      base.appendChild(water);
      scene.appendChild(base);

      const zones = CW.svg('g', { class: 'layer-zones' });
      for (const z of city.zones) {
        if (!z.d) continue;                 // zone virtuelle « Alentours » : rien à tracer
        const p = CW.svg('path', { d: z.d, class: 'zone', 'data-zone': z.id });
        p.addEventListener('click', (e) => { if (!this._moved) this.onZone(z.id, e); });
        zones.appendChild(p);
      }
      scene.appendChild(zones);
      scene.appendChild(CW.svg('path', { d: city.outline, class: 'outline' }));

      const zl = CW.svg('g', { class: 'layer-zone-labels' });
      for (const z of city.zones) {
        if (!z.d) continue;
        zl.appendChild(CW.svg('text', { x: z.cx, y: z.cy, class: 'zone-label', text: z.label }));
      }
      scene.appendChild(zl);
      const sl = CW.svg('g', { class: 'layer-sub-labels' });
      for (const l of city.labels || []) sl.appendChild(CW.svg('text', { x: l.x, y: l.y, class: 'sub-label', text: l.name }));
      scene.appendChild(sl);

      const pins = CW.svg('g', { class: 'layer-pins' });
      this.pinLayer = pins;
      scene.appendChild(pins);
      svg.appendChild(scene);
      this.setSpots(spots || city.spots);
      this.reset(false);
    }

    /** (Re)construit la couche d'épingles — liste curatée plus lieux personnels. */
    setSpots(spots) {
      CW.clear(this.pinLayer);
      this.pins.clear();
      for (const s of spots) {
        const g = CW.svg('g', {
          class: `pin${s.custom ? ' is-custom' : ''}`, transform: `translate(${s.x} ${s.y})`,
          'data-id': s.id, tabindex: -1, role: 'button', 'aria-label': s.name,
        });
        const inner = CW.svg('g', { class: 'pin-inner' });
        // Cible tactile généreuse, invisible : le doigt est plus large que l'épingle.
        inner.appendChild(CW.svg('circle', { cx: 0, cy: -11, r: 15, class: 'pin-hit' }));
        inner.appendChild(CW.svg('path', { d: PIN_D, class: 'pin-body' }));
        inner.appendChild(CW.svg('circle', { cx: 0, cy: -14.5, r: 3.2, class: 'pin-dot' }));
        inner.appendChild(CW.svg('text', { x: 12, y: -11, class: 'pin-label', text: s.name }));
        g.appendChild(inner);
        g.addEventListener('click', (e) => { e.stopPropagation(); if (!this._moved && !this.addMode) this.onSelect(s.id); });
        g.addEventListener('pointerenter', () => this._tip(s, g));
        g.addEventListener('pointerleave', () => this._hideTip());
        this.pinLayer.appendChild(g);
        this.pins.set(s.id, { g, inner, spot: s });
      }
      this._apply();
      this.refresh();
    }

    /** viewBox -> latitude/longitude (inverse de la projection du build). */
    unproject(x, y) {
      const pr = this.city.projection;
      const mx = (x - pr.pad) / pr.scale + pr.x0;
      const my = (y - pr.pad) / pr.scale + pr.y0;
      const lon = (mx * 180) / Math.PI;
      const lat = ((2 * Math.atan(Math.exp(-my)) - Math.PI / 2) * 180) / Math.PI;
      return { lat: Math.round(lat * 1e6) / 1e6, lon: Math.round(lon * 1e6) / 1e6 };
    }

    /** Quartier contenant un point du viewBox, via le tracé SVG lui-même. */
    zoneAt(x, y) {
      const paths = this.svg.querySelectorAll('.zone');
      for (const path of paths) {
        try {
          if (path.isPointInFill && path.isPointInFill(new DOMPoint(x, y))) return path.dataset.zone;
        } catch (_) { /* isPointInFill absent : on retombe sur le centroïde */ }
      }
      let best = null, bestD = Infinity;
      for (const z of this.city.zones) {
        const d = Math.hypot(z.cx - x, z.cy - y);
        if (d < bestD) { bestD = d; best = z.id; }
      }
      return best;
    }

    /** Le point est-il à l'intérieur de la commune ? */
    insideCity(x, y) {
      const outline = this.svg.querySelector('.outline');
      try {
        if (outline && outline.isPointInFill) return outline.isPointInFill(new DOMPoint(x, y));
      } catch (_) { /* rien */ }
      return true;
    }

    /** Fond détaillé : les tuiles remplacent visuellement le fond sobre. */
    setTiles(on, variant) {
      if (!this.tiles) return;
      if (variant) this.tiles.setVariant(variant);
      this.tiles.setEnabled(on);
      this.svg.classList.toggle('has-tiles', !!on);
      this._apply();
    }

    setAddMode(on) {
      this.addMode = !!on;
      this.svg.classList.toggle('is-adding', this.addMode);
      this._hideTip();
    }

    /** Met à jour l'état visuel des épingles (fait / à faire / sélection). */
    refresh() {
      for (const [id, p] of this.pins) {
        const e = this.getEntry(id);
        p.g.classList.toggle('is-done', CW.isDone(e));
        p.g.classList.toggle('is-selected', id === this.selected);
        p.g.classList.toggle('is-dim', !!this.filter && !this.filter.has(id));
      }
      // L'épingle sélectionnée passe au-dessus.
      if (this.selected && this.pins.has(this.selected)) this.pinLayer.appendChild(this.pins.get(this.selected).g);
    }

    setFilter(idSet) { this.filter = idSet; this.refresh(); }

    select(id, fly) {
      this.selected = id;
      this.refresh();
      if (fly && id && this.pins.has(id)) {
        const s = this.pins.get(id).spot;
        this.flyTo(s.x, s.y, Math.max(this.k, this.city.id === 'paris' ? 3.2 : 2.6));
      }
    }

    _tip(s, g) {
      if (!this.tooltip || CW.isTouch()) return;
      const e = this.getEntry(s.id);
      const done = CW.isDone(e);
      this.tooltip.textContent = '';
      this.tooltip.appendChild(CW.el('strong', { text: s.name }));
      this.tooltip.appendChild(CW.el('span', { text: done ? ' · photographié' : ' · à faire', class: done ? 'is-done' : '' }));
      this.tooltip.hidden = false;
      const r = g.getBoundingClientRect();
      const sr = this.stage.getBoundingClientRect();
      this.tooltip.style.left = `${r.left + r.width / 2 - sr.left}px`;
      this.tooltip.style.top = `${r.top - sr.top - 6}px`;
    }
    _hideTip() { if (this.tooltip) this.tooltip.hidden = true; }

    // ------------------------------------------------------------ transform

    _apply() {
      this.scene.setAttribute('transform', `translate(${this.tx} ${this.ty}) scale(${this.k})`);
      const s = 1 / this.k;
      const pinScale = s * CW.clamp(0.75 + this.k * 0.12, 0.8, 1.15);
      for (const p of this.pins.values()) p.inner.setAttribute('transform', `scale(${pinScale})`);
      if (this.tiles && this.tiles.enabled) {
        const m = this._metrics();
        this.tiles.update({ k: this.k, tx: this.tx, ty: this.ty }, m.scale);
      }
      const tier = this.k >= (this.city.id === 'paris' ? 2.6 : 2.0) ? 2 : this.k >= 1.6 ? 1 : 0;
      this.svg.dataset.zoomTier = String(tier);
      this.svg.dataset.labels = this.showLabels ? '1' : '0';
      this.svg.style.setProperty('--inv', String(s));
    }

    _metrics() {
      const r = this.svg.getBoundingClientRect();
      const { w, h } = this.city.view;
      const scale = Math.min(r.width / w, r.height / h) || 1;
      return { r, scale, offX: (r.width - w * scale) / 2, offY: (r.height - h * scale) / 2 };
    }
    /** client -> coordonnées viewBox */
    _toVB(cx, cy) {
      const m = this._metrics();
      return { x: (cx - m.r.left - m.offX) / m.scale, y: (cy - m.r.top - m.offY) / m.scale };
    }

    _clampPan() {
      const { w, h } = this.city.view;
      const k = this.k;
      // La carte doit rester au moins à moitié visible.
      this.tx = CW.clamp(this.tx, -w * k + w * 0.35, w * 0.65);
      this.ty = CW.clamp(this.ty, -h * k + h * 0.35, h * 0.65);
    }

    zoomAt(vbx, vby, factor, animate) {
      const k2 = CW.clamp(this.k * factor, MIN_K, MAX_K);
      const f = k2 / this.k;
      this.tx = vbx - (vbx - this.tx) * f;
      this.ty = vby - (vby - this.ty) * f;
      this.k = k2;
      this._clampPan();
      animate ? this._animate() : this._apply();
    }
    zoomBy(factor) {
      const { w, h } = this.city.view;
      this.zoomAt(w / 2, h / 2, factor, true);
    }
    flyTo(x, y, k) {
      const { w, h } = this.city.view;
      this.k = CW.clamp(k, MIN_K, MAX_K);
      this.tx = w / 2 - x * this.k;
      this.ty = h / 2 - y * this.k;
      this._clampPan();
      this._animate();
    }
    reset(animate) {
      this.k = 1; this.tx = 0; this.ty = 0;
      animate ? this._animate() : this._apply();
    }
    focusZone(zoneId) {
      const path = this.svg.querySelector(`.zone[data-zone="${zoneId}"]`);
      if (!path) return;
      const b = path.getBBox();
      const { w, h } = this.city.view;
      const k = CW.clamp(Math.min(w / (b.width * 1.3), h / (b.height * 1.3)), MIN_K, 8);
      this.flyTo(b.x + b.width / 2, b.y + b.height / 2, k);
    }

    _animate() {
      if (CW.prefersReducedMotion()) { this._apply(); return; }
      const from = this._last || { k: this.k, tx: this.tx, ty: this.ty };
      const to = { k: this.k, tx: this.tx, ty: this.ty };
      const t0 = performance.now();
      const dur = 320;
      cancelAnimationFrame(this._raf);
      const step = (now) => {
        const t = Math.min(1, (now - t0) / dur);
        const e = 1 - Math.pow(1 - t, 3);
        this.k = from.k + (to.k - from.k) * e;
        this.tx = from.tx + (to.tx - from.tx) * e;
        this.ty = from.ty + (to.ty - from.ty) * e;
        this._apply();
        if (t < 1) this._raf = requestAnimationFrame(step);
        else { this.k = to.k; this.tx = to.tx; this.ty = to.ty; this._apply(); this._last = { ...to }; }
      };
      this._raf = requestAnimationFrame(step);
    }

    // --------------------------------------------------------------- events

    _bind() {
      const svg = this.svg;
      svg.addEventListener('pointerdown', (e) => {
        if (!this.city) return;
        if (e.button !== undefined && e.button !== 0 && e.pointerType === 'mouse') return;
        this._hideTip();
        this.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
        try { svg.setPointerCapture(e.pointerId); } catch (_) { /* rien */ }
        if (this.pointers.size === 1) {
          this.drag = { x: e.clientX, y: e.clientY, tx: this.tx, ty: this.ty };
          this._moved = false;
        } else if (this.pointers.size === 2) {
          const [a, b] = Array.from(this.pointers.values());
          this.pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), k: this.k, tx: this.tx, ty: this.ty, cx: (a.x + b.x) / 2, cy: (a.y + b.y) / 2 };
          this.drag = null;
        }
      });
      svg.addEventListener('pointermove', (e) => {
        if (!this.pointers.has(e.pointerId)) return;
        this.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
        const m = this._metrics();
        if (this.pointers.size >= 2 && this.pinch) {
          const [a, b] = Array.from(this.pointers.values());
          const d = Math.hypot(a.x - b.x, a.y - b.y);
          const cx = (a.x + b.x) / 2, cy = (a.y + b.y) / 2;
          const f = CW.clamp((d / this.pinch.d) * this.pinch.k, MIN_K, MAX_K) / this.pinch.k;
          const c0 = this._toVB(this.pinch.cx, this.pinch.cy);
          this.k = this.pinch.k * f;
          this.tx = c0.x - (c0.x - this.pinch.tx) * f + (cx - this.pinch.cx) / m.scale;
          this.ty = c0.y - (c0.y - this.pinch.ty) * f + (cy - this.pinch.cy) / m.scale;
          this._moved = true;
          this._clampPan();
          this._apply();
        } else if (this.drag) {
          const dx = e.clientX - this.drag.x, dy = e.clientY - this.drag.y;
          if (Math.hypot(dx, dy) > 4) this._moved = true;
          if (!this._moved) return;
          this.tx = this.drag.tx + dx / m.scale;
          this.ty = this.drag.ty + dy / m.scale;
          this._clampPan();
          this._apply();
        }
      });
      const up = (e) => {
        this.pointers.delete(e.pointerId);
        try { svg.releasePointerCapture(e.pointerId); } catch (_) { /* rien */ }
        if (this.pointers.size < 2) this.pinch = null;
        if (this.pointers.size === 0) {
          this.drag = null;
          this._last = { k: this.k, tx: this.tx, ty: this.ty };
          setTimeout(() => { this._moved = false; }, 0);
        }
      };
      svg.addEventListener('pointerup', up);
      svg.addEventListener('pointercancel', up);
      svg.addEventListener('wheel', (e) => {
        if (!this.city) return;
        e.preventDefault();
        const p = this._toVB(e.clientX, e.clientY);
        const f = Math.exp(-e.deltaY * (e.deltaMode === 1 ? 0.05 : 0.0018));
        this.zoomAt(p.x, p.y, f, false);
        this._last = { k: this.k, tx: this.tx, ty: this.ty };
      }, { passive: false });
      svg.addEventListener('dblclick', (e) => {
        if (!this.city) return;
        const p = this._toVB(e.clientX, e.clientY);
        this.zoomAt(p.x, p.y, 1.8, true);
      });
      svg.addEventListener('keydown', (e) => {
        if (!this.city) return;
        const step = 40 / this.k;
        const map = { ArrowLeft: [step, 0], ArrowRight: [-step, 0], ArrowUp: [0, step], ArrowDown: [0, -step] };
        if (map[e.key]) { this.tx += map[e.key][0] * this.k; this.ty += map[e.key][1] * this.k; this._clampPan(); this._apply(); e.preventDefault(); }
        else if (e.key === '+' || e.key === '=') { this.zoomBy(1.4); e.preventDefault(); }
        else if (e.key === '-') { this.zoomBy(1 / 1.4); e.preventDefault(); }
        else if (e.key === '0') { this.reset(true); e.preventDefault(); }
      });
      svg.addEventListener('click', (e) => {
        if (this._moved || !this.city) return;
        if (this.addMode) {
          const p = this._toVB(e.clientX, e.clientY);
          const scene = { x: (p.x - this.tx) / this.k, y: (p.y - this.ty) / this.k };
          this.onAddPoint(scene.x, scene.y);
          return;
        }
        this.onSelect(null);
      });
      window.addEventListener('resize', () => this._hideTip());
    }
  }

  CW.CityMap = CityMap;
})();

/* ---- ui.js ---- */
/* CityWalker — interface : liste, filtres, fiche d'un lieu, progression, modales. */
(function () {
  'use strict';
  const CW = window.CW;
  const { el, $, clear } = CW;

  function catIcon(catId, cls) {
    const c = CW.CATS[catId];
    const svg = CW.svg('svg', { class: cls || 'cat-ico', viewBox: '0 0 24 24', 'aria-hidden': 'true', focusable: 'false' });
    svg.appendChild(CW.svg('path', { d: c ? c.glyph : 'M12 3v18M3 12h18', fill: 'none', stroke: 'currentColor', 'stroke-width': 1.6, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }));
    return svg;
  }
  CW.catIcon = catIcon;

  function ring(pct, size, label) {
    const r = 42, c = 2 * Math.PI * r;
    const svg = CW.svg('svg', { class: 'ring', viewBox: '0 0 100 100', width: size, height: size, 'aria-hidden': 'true' });
    svg.appendChild(CW.svg('circle', { cx: 50, cy: 50, r, class: 'ring-bg' }));
    svg.appendChild(CW.svg('circle', {
      cx: 50, cy: 50, r, class: 'ring-fg', transform: 'rotate(-90 50 50)',
      'stroke-dasharray': `${(c * CW.clamp(pct, 0, 100)) / 100} ${c}`,
    }));
    svg.appendChild(CW.svg('text', { x: 50, y: 52, class: 'ring-text', text: label !== undefined ? label : `${Math.round(pct)}%` }));
    return svg;
  }
  CW.ring = ring;

  function bar(done, total) {
    const pct = total ? (done / total) * 100 : 0;
    return el('span', { class: 'bar', role: 'img', 'aria-label': `${done} sur ${total}` },
      el('span', { class: 'bar-fill', style: { width: `${pct}%` } }));
  }

  function tagChip(tag, on, onToggle) {
    return el('button', {
      type: 'button', class: `tag-chip${on ? ' is-on' : ''}`, 'aria-pressed': on ? 'true' : 'false',
      title: tag.label, onclick: onToggle,
    }, [el('span', { class: 'tag-emoji', 'aria-hidden': 'true', text: tag.emoji }), el('span', { class: 'tag-text', text: tag.short })]);
  }

  CW.ui = { catIcon, ring, bar, tagChip };
})();

/* ---- main.js ---- */
/* CityWalker — orchestration de l'application. */
(function () {
  'use strict';
  const CW = window.CW;
  const { el, $, $$, clear } = CW;
  const { catIcon, ring, bar, tagChip } = CW.ui;

  const app = {
    cities: {},          // données statiques par ville
    cityId: 'paris',
    city: null,
    settings: CW.store.getSettings(),
    shared: null,        // {city, owner, progress} quand on regarde une carte partagée
    selected: null,
    filters: { q: '', state: 'tous', zone: '', cat: '', tags: [] },
    map: null,
    addMode: false,
    pinMode: 'tous',
    visible: new Set(),
  };
  window.CityWalker = app;

  // -------------------------------------------------------------- progression

  const progressOf = () => (app.shared ? app.shared.progress : CW.store.loadProgress(app.cityId));
  const entryOf = (id) => progressOf().spots[id] || null;
  const readOnly = () => !!app.shared;
  const customSpots = () => progressOf().custom || [];
  /** Liste curatée plus lieux posés à la main : ce que voient la carte et la liste. */
  const allSpots = () => app.city.spots.concat(customSpots());
  const spotById = (id) => allSpots().find((s) => s.id === id) || null;

  // -------------------------------------------------------------- chargement

  async function loadCity(id) {
    if (app.cities[id]) return app.cities[id];
    // Version « un seul fichier » : les données sont déjà dans la page.
    if (window.CW_DATA && window.CW_DATA[id]) {
      app.cities[id] = window.CW_DATA[id];
      return app.cities[id];
    }
    let res;
    try {
      res = await fetch(`data/${id}.json`, { cache: 'no-cache' });
    } catch (_) {
      throw new Error("Les données n'ont pas pu être chargées. Ouvre la page via un serveur (http://) et non par double-clic sur le fichier.");
    }
    if (!res.ok) throw new Error(`Impossible de charger la carte de ${id} (${res.status}).`);
    const data = await res.json();
    app.cities[id] = data;
    return data;
  }

  // ------------------------------------------------------------------ thème

  // `data-theme` peut déjà être posé par l'hôte (ex. la visionneuse d'artifact) :
  // on ne l'efface que si c'est nous qui l'avions posé.
  let themeOwned = false;
  function applyTheme() {
    const t = app.settings.theme;
    const root = document.documentElement;
    if (t === 'auto') {
      if (themeOwned) { root.removeAttribute('data-theme'); themeOwned = false; }
    } else {
      root.setAttribute('data-theme', t);
      themeOwned = true;
    }
  }
  function cycleTheme() {
    const order = ['auto', 'light', 'dark'];
    const next = order[(order.indexOf(app.settings.theme) + 1) % order.length];
    app.settings = CW.store.setSettings({ theme: next });
    applyTheme();
    if (app.map && app.map.city) applyTiles();
    CW.toast(`Thème : ${{ auto: 'automatique', light: 'clair', dark: 'sombre' }[next]}`);
  }

  // ------------------------------------------------------------------ filtres

  function matches(spot) {
    const f = app.filters;
    if (app.pinMode === 'mine' && !spot.custom) return false;
    if (app.pinMode === 'curated' && spot.custom) return false;
    const e = entryOf(spot.id);
    const done = CW.isDone(e);
    if (f.state === 'done' && !done) return false;
    if (f.state === 'todo' && done) return false;
    if (f.zone === '__custom') { if (!spot.custom) return false; }
    else if (f.zone && (spot.custom || spot.zone !== f.zone)) return false;
    if (f.cat && spot.cat !== f.cat) return false;
    if (f.tags.length) {
      const tags = e ? e.tags || [] : [];
      if (!f.tags.every((t) => tags.includes(t))) return false;
    }
    if (f.q) {
      const zone = app.city.zones.find((z) => z.id === spot.zone);
      const hay = CW.norm([spot.name, spot.sub || '', zone ? zone.name : '', zone ? zone.label : '', CW.catLabel(spot.cat)].join(' '));
      if (!hay.includes(f.q)) return false;
    }
    return true;
  }

  function activeFilterCount() {
    const f = app.filters;
    return (f.zone ? 1 : 0) + (f.cat ? 1 : 0) + f.tags.length;
  }

  // -------------------------------------------------------------------- liste

  function renderList() {
    const host = $('#liste-lieux');
    clear(host);
    const visible = allSpots().filter(matches);
    app.visible = new Set(visible.map((s) => s.id));
    const narrowed = activeFilterCount() || app.filters.q || app.filters.state !== 'tous' || app.pinMode !== 'tous';
    app.map.setFilter(narrowed ? app.visible : null);

    const summary = $('#list-summary');
    const stats = CW.computeStats(app.city, progressOf());
    summary.textContent = visible.length === allSpots().length
      ? `${stats.done} / ${stats.total} lieux photographiés`
      : `${visible.length} ${CW.plural(visible.length, 'lieu affiché', 'lieux affichés')} sur ${stats.total}`;

    const fc = $('#filter-count');
    const n = activeFilterCount();
    fc.textContent = n ? `(${n})` : '';

    if (!visible.length) {
      host.appendChild(el('p', { class: 'empty' }, 'Aucun lieu ne correspond. Essaie de retirer un filtre.'));
      return;
    }

    const byZone = new Map();
    for (const s of visible) {
      const key = s.custom ? '__custom' : s.zone;
      if (!byZone.has(key)) byZone.set(key, []);
      byZone.get(key).push(s);
    }
    const zonesPlusCustom = app.city.zones.concat([{ id: '__custom', name: 'Mes lieux', label: 'Mes lieux' }]);
    for (const z of zonesPlusCustom) {
      const list = byZone.get(z.id);
      if (!list) continue;
      const zs = stats.byZone[z.id] || { done: list.filter((x) => CW.isDone(entryOf(x.id))).length, total: list.length };
      const group = el('section', { class: 'group' });
      group.appendChild(el('h3', { class: 'group-head' }, [
        el('button', {
          type: 'button', class: 'group-title', title: `Zoomer sur ${z.name}`,
          onclick: () => { if (z.id !== '__custom' && z.d !== '') app.map.focusZone(z.id); setView('carte'); },
        }, [
          el('span', { class: 'group-label', text: z.label }),
          el('span', { class: 'group-name', text: z.label === z.name ? '' : z.name }),
        ]),
        el('span', { class: 'group-count', text: `${zs.done}/${zs.total}` }),
        bar(zs.done, zs.total),
      ]));
      const ul = el('ul', { class: 'spot-list' });
      for (const s of list) ul.appendChild(spotRow(s));
      group.appendChild(ul);
      host.appendChild(group);
    }
  }

  function spotRow(s) {
    const e = entryOf(s.id);
    const done = CW.isDone(e);
    const li = el('li', { class: `spot-row${done ? ' is-done' : ''}${s.id === app.selected ? ' is-selected' : ''}`, 'data-id': s.id });
    const btn = el('button', { type: 'button', class: 'spot-btn', onclick: () => selectSpot(s.id, true) }, [
      el('span', { class: 'spot-check', 'aria-hidden': 'true' }, done ? '✓' : ''),
      el('span', { class: 'spot-main' }, [
        el('span', { class: 'spot-name', text: s.name }),
        el('span', { class: 'spot-meta' }, [
          catIcon(s.cat, 'cat-ico cat-ico-sm'),
          el('span', { text: CW.catLabel(s.cat) }),
          s.sub ? el('span', { class: 'spot-sub', text: `· ${s.sub}` }) : null,
        ]),
      ]),
      el('span', { class: 'spot-tags' }, (e && e.tags ? e.tags : []).slice(0, 4).map((t) => el('span', { class: 'mini-tag', title: CW.TAG_BY_ID[t].label, text: CW.TAG_BY_ID[t].emoji }))),
      e && (e.photos.length || e.photoCount) ? el('span', { class: 'spot-photos', title: 'photos', text: `▣ ${e.photos.length || e.photoCount}` }) : null,
    ]);
    li.appendChild(btn);
    return li;
  }

  // ------------------------------------------------------------ fiche du lieu

  function selectSpot(id, fly) {
    app.selected = id;
    app.map.select(id, fly !== false);
    renderSheet();
    $$('.spot-row').forEach((r) => r.classList.toggle('is-selected', r.dataset.id === id));
    if (id) {
      const row = document.querySelector(`.spot-row[data-id="${id}"]`);
      if (row) row.scrollIntoView({ block: 'nearest', behavior: CW.prefersReducedMotion() ? 'auto' : 'smooth' });
    }
  }

  /** Sur mobile, la feuille se ferme en la tirant vers le bas. */
  function bindSheetDrag() {
    const sheet = $('#sheet');
    let start = null;
    const isMobile = () => window.matchMedia('(max-width: 900px)').matches;

    sheet.addEventListener('pointerdown', (e) => {
      if (!isMobile()) return;
      const onGrip = e.target.closest('.sheet-grip, .sheet-head');
      if (!onGrip || e.target.closest('button, input, select, textarea, a')) return;
      start = { y: e.clientY, id: e.pointerId };
      sheet.style.transition = 'none';
      try { sheet.setPointerCapture(e.pointerId); } catch (_) { /* rien */ }
    });
    sheet.addEventListener('pointermove', (e) => {
      if (!start || e.pointerId !== start.id) return;
      const dy = Math.max(0, e.clientY - start.y);
      sheet.style.transform = `translateY(${dy}px)`;
    });
    const end = (e) => {
      if (!start || e.pointerId !== start.id) return;
      const dy = Math.max(0, e.clientY - start.y);
      start = null;
      sheet.style.transition = '';
      try { sheet.releasePointerCapture(e.pointerId); } catch (_) { /* rien */ }
      if (dy > 90) {
        sheet.style.transform = 'translateY(100%)';
        setTimeout(() => { sheet.style.transform = ''; closeSheet(); }, 180);
      } else {
        sheet.style.transform = '';
      }
    };
    sheet.addEventListener('pointerup', end);
    sheet.addEventListener('pointercancel', end);
  }

  function closeSheet() {
    app.selected = null;
    app.map.select(null);
    $('#sheet').hidden = true;
    $('#sheet-backdrop').hidden = true;
    $$('.spot-row').forEach((r) => r.classList.remove('is-selected'));
  }

  function renderSheet() {
    const sheet = $('#sheet');
    const inner = $('#sheet-inner');
    if (!app.selected) { closeSheet(); return; }
    const s = spotById(app.selected);
    if (!s) { closeSheet(); return; }
    const zone = app.city.zones.find((z) => z.id === s.zone);
    const e = app.shared ? (progressOf().spots[s.id] || CW.emptyEntry()) : CW.store.ensureEntry(app.cityId, s.id);
    const done = CW.isDone(e);

    clear(inner);
    inner.appendChild(el('header', { class: 'sheet-head' }, [
      el('div', { class: 'sheet-titles' }, [
        el('h2', { id: 'sheet-title', class: 'sheet-title', text: s.name }),
        el('p', { class: 'sheet-sub' }, [
          catIcon(s.cat, 'cat-ico cat-ico-sm'),
          el('span', { text: CW.catLabel(s.cat) }),
          el('span', { text: ' · ' }),
          el('span', { text: zone ? (zone.label === zone.name ? zone.name : `${zone.label} — ${zone.name}`) : s.zone }),
          s.sub ? el('span', { text: ` · ${s.sub}` }) : null,
        ]),
      ]),
      el('button', { type: 'button', class: 'btn btn-icon sheet-close', 'aria-label': 'Fermer la fiche', onclick: closeSheet }, '✕'),
    ]));

    if (s.tip) inner.appendChild(el('p', { class: 'tip' }, [el('span', { class: 'tip-ico', 'aria-hidden': 'true', text: '◆' }), s.tip]));

    if (s.custom && !readOnly()) {
      const grid = el('div', { class: 'field-grid' });
      grid.appendChild(el('label', { class: 'field' }, [
        el('span', { class: 'field-label', text: 'Nom du lieu' }),
        el('input', {
          type: 'text', class: 'custom-name', value: s.name === 'Lieu sans nom' ? '' : s.name,
          placeholder: 'Ex. le muret derrière la gare', maxlength: 80,
          oninput: CW.debounce((ev) => renameCustomSpot(s, { name: ev.target.value.trim() || 'Lieu sans nom' }), 400),
        }),
      ]));
      grid.appendChild(el('label', { class: 'field' }, [
        el('span', { class: 'field-label', text: 'Catégorie' }),
        el('select', { onchange: (ev) => { renameCustomSpot(s, { cat: ev.target.value }); renderSheet(); } },
          Object.keys(CW.CATS).sort((a, b) => CW.catLabel(a).localeCompare(CW.catLabel(b), 'fr'))
            .map((c) => el('option', { value: c, selected: s.cat === c }, CW.catLabel(c)))),
      ]));
      inner.appendChild(grid);
      inner.appendChild(el('p', { class: 'hint', text: `Posé à ${s.lat.toFixed(5)}, ${s.lon.toFixed(5)}.` }));
    }

    if (readOnly()) {
      inner.appendChild(el('p', { class: 'sheet-ro' }, done ? 'Photographié ✓' : 'Pas encore photographié'));
      if (e.tags.length) inner.appendChild(el('div', { class: 'tag-row' }, e.tags.map((t) => el('span', { class: 'tag-chip is-on is-static' }, [el('span', { class: 'tag-emoji', text: CW.TAG_BY_ID[t].emoji }), el('span', { class: 'tag-text', text: CW.TAG_BY_ID[t].short })]))));
      if (e.date) inner.appendChild(el('p', { class: 'sheet-date', text: CW.fmtDate(e.date) }));
      if (e.photoCount) inner.appendChild(el('p', { class: 'sheet-date', text: `${e.photoCount} ${CW.plural(e.photoCount, 'photo', 'photos')} (non incluses dans un lien de partage)` }));
      if (e.note) inner.appendChild(el('p', { class: 'sheet-note-ro', text: e.note }));
    } else {
      // Bouton principal : photographié ou non
      const toggle = el('button', {
        type: 'button', class: `done-toggle${done ? ' is-on' : ''}`, 'aria-pressed': done ? 'true' : 'false',
        onclick: () => {
          const nowDone = !CW.isDone(e);
          const patch = { done: nowDone };
          if (nowDone && !e.date) patch.date = CW.todayISO();
          CW.store.updateEntry(app.cityId, s.id, patch);
          refreshAll();
          renderSheet();
        },
      }, [el('span', { class: 'done-mark', 'aria-hidden': 'true', text: done ? '✓' : '' }), el('span', { text: done ? 'Photographié' : "Je l'ai photographié" })]);
      inner.appendChild(toggle);

      inner.appendChild(el('h3', { class: 'sheet-h3', text: 'Ambiance capturée' }));
      const tagRow = el('div', { class: 'tag-row' });
      for (const t of CW.TAGS) {
        const on = e.tags.includes(t.id);
        tagRow.appendChild(tagChip(t, on, () => {
          const tags = new Set(e.tags);
          on ? tags.delete(t.id) : tags.add(t.id);
          const patch = { tags: Array.from(tags) };
          if (!on && !CW.isDone(e)) { patch.done = true; if (!e.date) patch.date = CW.todayISO(); }
          CW.store.updateEntry(app.cityId, s.id, patch);
          refreshAll();
          renderSheet();
        }));
      }
      inner.appendChild(tagRow);
      if (s.best && s.best.length) {
        inner.appendChild(el('p', { class: 'sheet-hint' }, `Recommandé ici : ${s.best.map((b) => (CW.TAG_BY_ID[b] ? CW.TAG_BY_ID[b].label.toLowerCase() : b)).join(', ')}.`));
      }

      const grid = el('div', { class: 'field-grid' });
      grid.appendChild(el('label', { class: 'field' }, [
        el('span', { class: 'field-label', text: 'Date' }),
        el('input', {
          type: 'date', value: e.date || '', max: CW.todayISO(),
          oninput: (ev) => { CW.store.updateEntry(app.cityId, s.id, { date: ev.target.value }); refreshAll(); },
        }),
      ]));
      grid.appendChild(el('label', { class: 'field' }, [
        el('span', { class: 'field-label', text: 'Coup de cœur' }),
        el('div', { class: 'stars', role: 'group' }, [0, 1, 2, 3].slice(1).map((n) => el('button', {
          type: 'button', class: `star${e.rating >= n ? ' is-on' : ''}`, 'aria-label': `${n} sur 3`, 'aria-pressed': e.rating >= n ? 'true' : 'false',
          onclick: () => { CW.store.updateEntry(app.cityId, s.id, { rating: e.rating === n ? 0 : n }); refreshAll(); renderSheet(); },
        }, '★'))),
      ]));
      inner.appendChild(grid);

      inner.appendChild(el('label', { class: 'field' }, [
        el('span', { class: 'field-label', text: 'Note' }),
        el('textarea', {
          rows: 2, placeholder: 'Ce que tu as vu, l’objectif utilisé, à refaire…', maxlength: 2000,
          oninput: CW.debounce((ev) => { CW.store.updateEntry(app.cityId, s.id, { note: ev.target.value }); }, 400),
        }, e.note || ''),
      ]));

      inner.appendChild(el('h3', { class: 'sheet-h3', text: 'Photos' }));
      const photoHost = el('div', { class: 'photo-grid' });
      inner.appendChild(photoHost);
      const fileInput = el('input', {
        type: 'file', accept: 'image/*', multiple: true, class: 'visually-hidden', id: 'photo-input',
        onchange: (ev) => { addPhotos(s, Array.from(ev.target.files || [])); ev.target.value = ''; },
      });
      inner.appendChild(fileInput);
      inner.appendChild(el('button', {
        type: 'button', class: 'btn btn-add', onclick: () => fileInput.click(),
      }, CW.store.photosAvailable ? '+ Ajouter des photos' : '+ Ajouter des photos (indisponible ici)'));
      renderPhotos(photoHost, s);

      if (s.custom) {
        inner.appendChild(el('button', {
          type: 'button', class: 'btn btn-danger btn-small sheet-delete',
          onclick: () => deleteCustomSpot(s),
        }, 'Supprimer ce lieu'));
      }
    }

    sheet.hidden = false;
    sheet.style.transform = '';
    if (window.matchMedia('(max-width: 900px)').matches) $('#sheet-backdrop').hidden = false;
    sheet.scrollTop = 0;
  }

  async function renderPhotos(host, spot) {
    clear(host);
    let rows = [];
    try { rows = await CW.store.photosForSpot(app.cityId, spot.id); } catch (_) { rows = []; }
    if (!rows.length) {
      host.appendChild(el('p', { class: 'empty empty-sm' }, CW.store.photosAvailable
        ? 'Aucune photo pour l’instant. Elles restent sur cet appareil.'
        : 'Ce navigateur bloque le stockage local des images (navigation privée ?).'));
      return;
    }
    for (const r of rows) {
      const fig = el('figure', { class: 'photo' });
      fig.appendChild(el('img', { src: CW.store.objectURL(r, 'thumb'), alt: `Photo de ${spot.name}`, loading: 'lazy', width: 200, height: 150 }));
      fig.appendChild(el('button', {
        type: 'button', class: 'photo-del', title: 'Supprimer cette photo', 'aria-label': 'Supprimer cette photo',
        onclick: async () => {
          if (!confirm('Supprimer cette photo ? C’est définitif.')) return;
          await CW.store.deletePhoto(r.id);
          const e = CW.store.ensureEntry(app.cityId, spot.id);
          CW.store.updateEntry(app.cityId, spot.id, { photos: e.photos.filter((p) => p !== r.id) });
          refreshAll();
          renderSheet();
        },
      }, '✕'));
      fig.appendChild(el('a', { class: 'photo-open', href: CW.store.objectURL(r, 'full'), target: '_blank', rel: 'noopener', title: 'Ouvrir en grand' }, '⤢'));
      host.appendChild(fig);
    }
  }

  async function addPhotos(spot, files) {
    if (!files.length) return;
    if (!CW.store.photosAvailable) { CW.toast('Le stockage des photos est indisponible sur ce navigateur.', 'error'); return; }
    let ok = 0;
    for (const f of files) {
      try {
        const p = await CW.ingestPhoto(f);
        const id = CW.uid();
        await CW.store.putPhoto({
          id, city: app.cityId, spot: spot.id, w: p.w, h: p.h,
          takenAt: p.takenAt ? p.takenAt.toISOString() : '', caption: '', createdAt: Date.now(),
          full: p.full, thumb: p.thumb,
        });
        const e = CW.store.ensureEntry(app.cityId, spot.id);
        const patch = { photos: e.photos.concat([id]), done: true };
        if (!e.date) patch.date = p.takenAt ? CW.dateToISO(p.takenAt) : CW.todayISO();
        CW.store.updateEntry(app.cityId, spot.id, patch);
        ok++;
        if (p.lat !== null && p.lon !== null) {
          const near = CW.nearestSpot(app.city, p.lat, p.lon, 400);
          if (near && near.spot.id !== spot.id) {
            CW.toast(`Le GPS de cette photo pointe plutôt vers « ${near.spot.name} » (${near.distance} m).`, 'info', 6000);
          }
        }
      } catch (err) {
        CW.toast(err && err.message ? err.message : 'Photo illisible.', 'error');
      }
    }
    if (ok) CW.toast(`${ok} ${CW.plural(ok, 'photo ajoutée', 'photos ajoutées')}.`);
    refreshAll();
    renderSheet();
  }

  // ------------------------------------------------------ lieux personnels

  function toggleAddMode(on) {
    if (readOnly()) return;
    app.addMode = on === undefined ? !app.addMode : on;
    app.map.setAddMode(app.addMode);
    const btn = $('#btn-add-spot');
    btn.setAttribute('aria-pressed', app.addMode ? 'true' : 'false');
    btn.classList.toggle('is-on', app.addMode);
    $('#add-hint').hidden = !app.addMode;
    if (app.addMode) { setView('carte'); closeSheet(); }
  }

  function createCustomSpot(x, y) {
    if (readOnly()) return;
    const view = app.city.view;
    if (!(x >= 0 && x <= view.w && y >= 0 && y <= view.h)) {
      CW.toast('Ce point est hors de la carte. Pose l’épingle dessus.', 'error');
      return;
    }
    // Hors de la commune, le lieu rejoint le groupe « Alentours » quand il existe.
    const inCity = app.map.insideCity(x, y);
    const hasOutside = app.city.zones.some((z) => z.id === 'alentours');
    const zone = inCity ? (app.map.zoneAt(x, y) || '') : (hasOutside ? 'alentours' : app.map.zoneAt(x, y) || '');
    const { lat, lon } = app.map.unproject(x, y);
    const spot = CW.normalizeCustom({
      id: 'u' + CW.uid(), name: '', cat: 'insolite',
      zone,
      x: Math.round(x * 10) / 10, y: Math.round(y * 10) / 10, lat, lon,
    });
    const p = CW.store.loadProgress(app.cityId);
    p.custom.push(spot);
    CW.store.saveProgress(app.cityId);
    toggleAddMode(false);
    app.map.setSpots(allSpots());
    refreshAll();
    selectSpot(spot.id, false);
    const input = $('#sheet .custom-name');
    if (input) { input.focus(); input.select(); }
    CW.toast('Lieu posé. Donne-lui un nom.');
  }

  function deleteCustomSpot(spot) {
    if (!confirm(`Supprimer « ${spot.name} » et ses photos ? C'est définitif.`)) return;
    CW.store.photosForSpot(app.cityId, spot.id)
      .then((rows) => Promise.all(rows.map((r) => CW.store.deletePhoto(r.id))))
      .catch(() => {})
      .then(() => {
        const p = CW.store.loadProgress(app.cityId);
        p.custom = p.custom.filter((c) => c.id !== spot.id);
        delete p.spots[spot.id];
        CW.store.saveProgress(app.cityId);
        closeSheet();
        app.map.setSpots(allSpots());
        refreshAll();
        CW.toast('Lieu supprimé.');
      });
  }

  function renameCustomSpot(spot, patch) {
    const p = CW.store.loadProgress(app.cityId);
    const target = p.custom.find((c) => c.id === spot.id);
    if (!target) return;
    Object.assign(target, patch);
    CW.store.saveProgress(app.cityId);
    app.map.setSpots(allSpots());
    refreshAll();
  }

    if (!todo.length) { CW.toast(`Tout est photographié à ${app.city.name}. Chapeau.`); return; }

  // ------------------------------------------------- import de photothèque

  const RADIUS_CHOICES = [[120, '120 m — strict'], [250, '250 m — recommandé'], [500, '500 m — large']];

  function importModal() {
    if (readOnly()) return;
    openModal('Importer ma photothèque', (host) => {
      host.appendChild(el('p', { class: 'modal-lead' },
        'Choisis tes photos : CityWalker lit leur position GPS et les replace sur les lieux où elles ont été prises. Rien ne quitte cet appareil, et rien n’est écrit avant ton accord.'));
      const tip = isIOS()
        ? 'Sur iPhone, le sélecteur s’ouvre sur ta photothèque : appuie sur « Tout sélectionner » en haut, ou choisis un album entier.'
        : CW.photoImport.supportsDirectory()
          ? 'Pour tout passer en revue d’un coup, « choisir un dossier entier » lit aussi les sous-dossiers.'
          : 'Dans le sélecteur, Ctrl+A (ou ⌘+A) prend toutes les photos du dossier.';
      host.appendChild(el('p', { class: 'hint', text: tip }));

      const radiusField = el('label', { class: 'field' }, [
        el('span', { class: 'field-label', text: 'Distance maximale pour rattacher une photo à un lieu' }),
        el('select', {}, RADIUS_CHOICES.map(([v, t]) => el('option', { value: v, selected: v === 250 }, t))),
      ]);
      host.appendChild(radiusField);

      const status = el('p', { class: 'hint import-status', role: 'status' });
      const bar = el('div', { class: 'import-bar', hidden: true }, el('span'));
      const results = el('div', { class: 'import-results' });

      const input = el('input', {
        type: 'file', accept: 'image/*', multiple: true, class: 'visually-hidden',
        onchange: (ev) => { const f = Array.from(ev.target.files || []); ev.target.value = ''; start(f); },
      });
      const actions = el('div', { class: 'modal-actions' }, [
        input,
        el('button', { type: 'button', class: 'btn btn-primary', onclick: () => input.click() }, 'Autoriser et choisir mes photos'),
        CW.photoImport.supportsDirectory()
          ? el('button', {
              type: 'button', class: 'btn', onclick: async (ev) => {
                const btn = ev.currentTarget;
                btn.disabled = true;
                status.textContent = 'Lecture du dossier…';
                const files = await CW.photoImport.pickDirectory((n) => { status.textContent = `${n} photos trouvées…`; });
                btn.disabled = false;
                if (!files) { status.textContent = 'Accès au dossier refusé.'; return; }
                start(files);
              },
            }, 'Ou choisir un dossier entier')
          : null,
      ]);
      host.appendChild(actions);
      host.appendChild(status);
      host.appendChild(bar);
      host.appendChild(results);

      async function start(files) {
        CW.clear(results);
        const images = files.filter(CW.photoImport.isImage).slice(0, CW.photoImport.MAX_FILES);
        if (!images.length) { status.textContent = 'Aucune image dans cette sélection.'; return; }
        if (files.length > CW.photoImport.MAX_FILES) {
          CW.toast(`Limité aux ${CW.photoImport.MAX_FILES} premières photos.`, 'info');
        }
        bar.hidden = false;
        const fill = bar.firstChild;
        status.textContent = `Lecture de ${images.length} photos…`;
        const read = await CW.photoImport.readAll(images, (done, total) => {
          fill.style.width = `${(done / total) * 100}%`;
          status.textContent = `Lecture ${done} / ${total}…`;
        });
        bar.hidden = true;
        const radius = Number(radiusField.querySelector('select').value) || 250;
        const report = CW.photoImport.classify(read, app.city, allSpots(), radius);
        renderReport(report, read);
      }

      function renderReport(report, read) {
        CW.clear(results);
        const total = report.groups.reduce((n, g) => n + g.items.length, 0);
        if (!total) {
          const other = read.find((r) => r.lat !== null && CW.photoImport.cityOf(app.cities, r.lat, r.lon) && CW.photoImport.cityOf(app.cities, r.lat, r.lon) !== app.cityId);
          status.textContent = report.noGps === read.length
            ? 'Aucune de ces photos ne porte de position GPS. Vérifie que la localisation est activée dans l’appareil photo de ton téléphone.'
            : `Aucune photo ne tombe sur ${app.city.name}.`;
          if (other) {
            const otherCity = CW.photoImport.cityOf(app.cities, other.lat, other.lon);
            results.appendChild(el('button', {
              type: 'button', class: 'btn', onclick: () => { $('#modal').close(); switchCity(otherCity).then(importModal); },
            }, `Ces photos sont plutôt à ${app.cities[otherCity].name} — basculer`));
          }
          return;
        }

        status.textContent = `${total} ${CW.plural(total, 'photo replacée', 'photos replacées')} sur ${report.groups.length} ${CW.plural(report.groups.length, 'lieu', 'lieux')}.`
          + (report.noGps ? ` ${report.noGps} sans position GPS, ignorées.` : '')
          + (report.elsewhere.length ? ` ${report.elsewhere.length} hors des lieux connus, ignorées.` : '');

        const list = el('ul', { class: 'import-list' });
        for (const g of report.groups) {
          const label = g.kind === 'spot'
            ? g.spot.name
            : 'Nouveau lieu à créer';
          const detail = g.kind === 'spot'
            ? `${g.items.length} ${CW.plural(g.items.length, 'photo', 'photos')} · jusqu’à ${g.distance} m`
            : `${g.items.length} photos groupées · ${g.lat.toFixed(5)}, ${g.lon.toFixed(5)}`;
          const cb = el('input', { type: 'checkbox', checked: true });
          g._checkbox = cb;
          list.appendChild(el('li', { class: `import-row${g.kind === 'new' ? ' is-new' : ''}` }, [
            el('label', { class: 'check' }, [cb, el('span', {}, [
              el('strong', { text: label }), el('br'), el('span', { class: 'hint', text: detail }),
            ])]),
          ]));
        }
        results.appendChild(list);

        results.appendChild(el('button', {
          type: 'button', class: 'btn btn-primary', onclick: async (ev) => {
            const btn = ev.currentTarget;
            const chosen = report.groups.filter((g) => g._checkbox.checked);
            if (!chosen.length) { CW.toast('Rien de sélectionné.'); return; }
            btn.disabled = true;
            try {
              await applyImport(chosen, (done, all) => { btn.textContent = `Enregistrement ${done} / ${all}…`; });
            } catch (err) {
              CW.toast('Import interrompu : ' + ((err && err.message) || 'erreur inconnue'), 'error');
            } finally {
              btn.disabled = false;
              btn.textContent = 'Enregistrer ces photos';
              $('#modal').close();
            }
          },
        }, 'Enregistrer ces photos'));
      }
    });
  }

  async function applyImport(groups, onProgress) {
    const all = groups.reduce((n, g) => n + g.items.length, 0);
    let done = 0, ok = 0, failed = 0;
    for (const g of groups) {
      let spotId;
      if (g.kind === 'spot') {
        spotId = g.spot.id;
      } else {
        const view = app.city.view;
        const pr = app.city.projection;
        const mx = (g.lon * Math.PI) / 180;
        const my = -Math.log(Math.tan(Math.PI / 4 + (g.lat * Math.PI) / 360));
        const x = Math.round(((mx - pr.x0) * pr.scale + pr.pad) * 10) / 10;
        const y = Math.round(((my - pr.y0) * pr.scale + pr.pad) * 10) / 10;
        if (!(x >= 0 && x <= view.w && y >= 0 && y <= view.h)) { done += g.items.length; continue; }
        const first = g.items.find((i) => i.takenAt);
        const spot = CW.normalizeCustom({
          id: 'u' + CW.uid(),
          name: first && first.takenAt ? `Photos du ${CW.fmtDate(CW.dateToISO(first.takenAt))}` : 'Lieu importé',
          cat: 'insolite', zone: app.map.insideCity(x, y) ? (app.map.zoneAt(x, y) || '') : 'alentours',
          x, y, lat: g.lat, lon: g.lon,
        });
        const p = CW.store.loadProgress(app.cityId);
        p.custom.push(spot);
        CW.store.saveProgress(app.cityId);
        spotId = spot.id;
      }
      for (const item of g.items) {
        try {
          const photo = await CW.ingestPhoto(item.file);
          const id = CW.uid();
          await CW.store.putPhoto({
            id, city: app.cityId, spot: spotId, w: photo.w, h: photo.h,
            takenAt: photo.takenAt ? photo.takenAt.toISOString() : '', caption: '',
            createdAt: photo.takenAt ? photo.takenAt.getTime() : Date.now(),
            full: photo.full, thumb: photo.thumb,
          });
          const entry = CW.store.ensureEntry(app.cityId, spotId);
          const patch = { photos: entry.photos.concat([id]), done: true };
          const shot = photo.takenAt || item.takenAt;
          if (shot && (!entry.date || CW.dateToISO(shot) < entry.date)) patch.date = CW.dateToISO(shot);
          else if (!entry.date) patch.date = CW.todayISO();
          CW.store.updateEntry(app.cityId, spotId, patch);
          ok++;
        } catch (_) {
          failed++;
        }
        done++;
        if (onProgress) onProgress(done, all);
      }
    }
    CW.store.flushAll();
    app.map.setSpots(allSpots());
    refreshAll();
    renderSheet();
    CW.toast(failed
      ? `${ok} ${CW.plural(ok, 'photo importée', 'photos importées')}, ${failed} illisibles.`
      : `${ok} ${CW.plural(ok, 'photo importée', 'photos importées')}.`, failed ? 'error' : 'info', 6000);
  }

  // -------------------------------------------------------------- progression

  function renderProgress() {
    const host = $('#progress-body');
    clear(host);
    const stats = CW.computeStats(app.city, progressOf());

    host.appendChild(el('div', { class: 'prog-hero' }, [
      ring(stats.pct, 132),
      el('div', { class: 'prog-hero-txt' }, [
        el('p', { class: 'prog-level', text: stats.level.label }),
        el('p', { class: 'prog-count' }, [el('strong', { text: `${stats.done}` }), ` / ${stats.total} lieux photographiés`]),
        el('p', { class: 'prog-sub', text: `${stats.photos} ${CW.plural(stats.photos, 'photo enregistrée', 'photos enregistrées')} · ${stats.zonesVisited}/${stats.zonesTotal} ${app.city.zoneWordPlural} entamés · ${stats.zonesComplete} ${CW.plural(stats.zonesComplete, 'terminé', 'terminés')}` }),
        stats.customTotal ? el('p', { class: 'prog-sub', text: `Plus ${stats.customDone}/${stats.customTotal} ${CW.plural(stats.customTotal, 'lieu à toi', 'lieux à toi')}, hors du pourcentage.` }) : null,
        stats.next ? el('p', { class: 'prog-next', text: `Prochain palier à ${stats.next.min} % : ${stats.next.label}.` }) : null,
      ]),
    ]));

    host.appendChild(el('h3', { class: 'prog-h3', text: `Par ${app.city.zoneWord}` }));
    const zl = el('ul', { class: 'prog-list' });
    for (const z of app.city.zones) {
      const s = stats.byZone[z.id];
      if (!s) continue;
      zl.appendChild(el('li', { class: `prog-row${s.done === s.total && s.total ? ' is-complete' : ''}` }, [
        el('button', {
          type: 'button', class: 'prog-name', onclick: () => { if (z.d) app.map.focusZone(z.id); setView('carte'); },
        }, z.label === z.name ? z.name : `${z.label} · ${z.name}`),
        bar(s.done, s.total),
        el('span', { class: 'prog-num', text: `${s.done}/${s.total}` }),
      ]));
    }
    host.appendChild(zl);

    host.appendChild(el('h3', { class: 'prog-h3', text: 'Ambiances' }));
    const tl = el('ul', { class: 'prog-tags' });
    for (const t of CW.TAGS) {
      const n = stats.byTag[t.id] || 0;
      const goal = CW.TAG_GOALS[t.id];
      tl.appendChild(el('li', { class: `prog-tag${goal && n >= goal ? ' is-complete' : ''}${n ? '' : ' is-zero'}` }, [
        el('span', { class: 'tag-emoji', 'aria-hidden': 'true', text: t.emoji }),
        el('span', { class: 'prog-tag-label', text: t.label }),
        el('span', { class: 'prog-tag-num', text: goal ? `${n}/${goal}` : String(n) }),
      ]));
    }
    host.appendChild(tl);

    host.appendChild(el('h3', { class: 'prog-h3', text: 'Par catégorie' }));
    const cl = el('ul', { class: 'prog-list' });
    for (const c of Object.values(stats.byCat).sort((a, b) => b.total - a.total)) {
      cl.appendChild(el('li', { class: 'prog-row' }, [
        el('span', { class: 'prog-name prog-name-static' }, [catIcon(c.id, 'cat-ico cat-ico-sm'), c.label]),
        bar(c.done, c.total),
        el('span', { class: 'prog-num', text: `${c.done}/${c.total}` }),
      ]));
    }
    host.appendChild(cl);

    const sugg = CW.suggest(app.city, progressOf(), stats, 6);
    if (sugg.length) {
      host.appendChild(el('h3', { class: 'prog-h3', text: 'À faire ensuite' }));
      const ul = el('ul', { class: 'sugg-list' });
      for (const s of sugg) {
        ul.appendChild(el('li', {}, el('button', {
          type: 'button', class: 'sugg', onclick: () => { setView('carte'); selectSpot(s.id, true); },
        }, [
          catIcon(s.cat, 'cat-ico cat-ico-sm'),
          el('span', { class: 'sugg-name', text: s.name }),
          s.tip ? el('span', { class: 'sugg-tip', text: s.tip }) : null,
        ])));
      }
      host.appendChild(ul);
    }
  }

      const stats = CW.computeStats(app.city, p);
      host.appendChild(el('p', { class: 'modal-lead' }, `Carte de ${app.city.name} — ${stats.done}/${stats.total} lieux, ${stats.pct} %.`));

      const nameField = el('label', { class: 'field' }, [
        el('span', { class: 'field-label', text: 'Ton prénom (affiché sur la carte partagée)' }),
        el('input', { type: 'text', value: p.owner || app.settings.owner || '', maxlength: 40, placeholder: 'Ex. Souad' }),
      ]);
      host.appendChild(nameField);
      const nameInput = nameField.querySelector('input');

      const notesBox = el('label', { class: 'check' }, [
        el('input', { type: 'checkbox' }), el('span', { text: 'Inclure mes notes personnelles' }),
