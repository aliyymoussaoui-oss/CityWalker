# Publie le site sur GitHub Pages.
#
# L'environnement `github-pages` n'accepte, par défaut, que des déploiements
# venant de la branche par défaut du dépôt. Le workflow n'écoute donc qu'elle :
# une poussée sur `public` produirait un échec sans journal, avant le premier pas.
# Seuls les fichiers du site sont publiés : ni outils, ni tests, ni fixtures.
name: Publier sur GitHub Pages

on:
  push:
    branches: [claude/paris-montpellier-photo-maps-7nh7q2]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # On n'interrompt pas un déploiement en cours : deux poussées rapprochées
  # doivent se suivre, pas s'annuler l'une l'autre.
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rassembler le site, et lui seul
        run: |
          set -eu
          for f in index.html manifest.webmanifest sw.js data/paris.json data/montpellier.json; do
            test -f "$f" || { echo "manquant : $f"; exit 1; }
          done
          mkdir -p _site
          cp index.html manifest.webmanifest sw.js _site/
          cp -r assets data _site/
          touch _site/.nojekyll
          # Rien d'autre ne doit partir en ligne : ni outils, ni tests, ni build.
          for d in tools tests dist .github node_modules; do
            test ! -e "_site/$d" || { echo "$d ne devrait pas être publié"; exit 1; }
          done
          du -sh _site
      - name: Injecter la configuration de synchronisation
        env:
          # Variable de dépôt de préférence ; secret accepté aussi, car la clé
          # « anon » est publique par conception et beaucoup la rangent là.
          SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
        run: |
          set -eu
          if [ -n "${SUPABASE_URL:-}" ] && [ -n "${SUPABASE_ANON_KEY:-}" ]; then
            # La clé « anon » est publique par conception : ce sont les règles RLS
            # de la base qui protègent les données, pas le secret de cette clé.
            printf 'window.CW_CONFIG = {\n  supabaseUrl: %s,\n  supabaseAnonKey: %s,\n};\n' \
              "$(printf '%s' "$SUPABASE_URL" | python3 -c 'import json,sys;print(json.dumps(sys.stdin.read().strip()))')" \
              "$(printf '%s' "$SUPABASE_ANON_KEY" | python3 -c 'import json,sys;print(json.dumps(sys.stdin.read().strip()))')" \
              > _site/assets/js/config.js
            # Une configuration muette est le pire des cas : on vérifie que le
            # fichier écrit contient bien une URL https et une clé plausible.
            grep -q "supabaseUrl: \"https://" _site/assets/js/config.js \
              || { echo "URL Supabase invalide : elle doit commencer par https://"; exit 1; }
            grep -qE 'supabaseAnonKey: ".{40,}"' _site/assets/js/config.js \
              || { echo "Clé anon absente ou trop courte"; exit 1; }
            echo "Synchronisation configurée pour ${SUPABASE_URL}"
          else
            echo "Ni variable ni secret SUPABASE_URL / SUPABASE_ANON_KEY :"
            echo "le site est publié sans synchronisation, chacun devra coller"
            echo "ses deux valeurs dans Réglages → Compte et synchronisation."
            echo "Voir SYNCHRONISATION.md, section « Les deux valeurs à renseigner »."
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
