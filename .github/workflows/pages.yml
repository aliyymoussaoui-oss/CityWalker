# Publie le site sur GitHub Pages.
#
# L'environnement `github-pages` n'accepte, par défaut, que des déploiements
# venant de la branche par défaut du dépôt : le workflow écoute donc les deux
# branches, et c'est la poussée sur la branche par défaut qui déploie vraiment.
# Seuls les fichiers du site sont publiés : ni outils, ni tests, ni fixtures.
name: Publier sur GitHub Pages

on:
  push:
    branches: [public, claude/paris-montpellier-photo-maps-7nh7q2]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rassembler le site, et lui seul
        run: |
          set -eu
          for f in index.html manifest.webmanifest sw.js data/paris.json data/montpellier.json; do
            test -f "$f" || { echo "manquant : $f"; exit 1; }
          done
          mkdir -p _site
          cp index.html manifest.webmanifest sw.js _site/
          cp -r assets data _site/
          touch _site/.nojekyll
          # Rien d'autre ne doit partir en ligne : ni outils, ni tests, ni build.
          for d in tools tests dist .github node_modules; do
            test ! -e "_site/$d" || { echo "$d ne devrait pas être publié"; exit 1; }
          done
          du -sh _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
