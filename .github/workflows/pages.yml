# Publie le site sur GitHub Pages.
#
# L'environnement `github-pages` n'accepte, par défaut, que des déploiements
# venant de la branche par défaut du dépôt. Le workflow n'écoute donc qu'elle :
# une poussée sur `public` produirait un échec sans journal, avant le premier pas.
# Seuls les fichiers du site sont publiés : ni serveur, ni outils, ni tests.
name: Publier sur GitHub Pages

on:
  push:
    branches: [claude/paris-montpellier-photo-maps-7nh7q2]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # On n'interrompt pas un déploiement en cours : deux poussées rapprochées
  # doivent se suivre, pas s'annuler l'une l'autre.
  cancel-in-progress: false

jobs:
  # Le serveur de synchronisation d'abord (Cloudflare Worker, voir server/) :
  # le site a besoin de son adresse. Sans secrets Cloudflare, cette étape ne
  # fait rien et le site part sans synchronisation — il reste utilisable en
  # local. Si elle échoue, rien n'est publié : le site en ligne garde sa
  # version précédente, qui fonctionne.
  api:
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm install --no-audit --no-fund
      - id: deploy
        name: Déployer le serveur de synchronisation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: bash server/deploy.sh

  deploy:
    needs: api
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rassembler le site, et lui seul
        run: |
          set -eu
          for f in index.html manifest.webmanifest sw.js data/paris.json data/montpellier.json data/lyon.json data/france.json; do
            test -f "$f" || { echo "manquant : $f"; exit 1; }
          done
          mkdir -p _site
          cp index.html manifest.webmanifest sw.js _site/
          cp -r assets data _site/
          touch _site/.nojekyll
          # Rien d'autre ne doit partir en ligne : ni serveur, ni outils, ni tests.
          for d in server tools tests dist .github node_modules; do
            test ! -e "_site/$d" || { echo "$d ne devrait pas être publié"; exit 1; }
          done
          du -sh _site
      - name: Brancher le site sur le serveur de synchronisation
        env:
          API_URL: ${{ needs.api.outputs.url }}
        run: |
          set -eu
          # La clé CARTO reste celle du dépôt, sauf variable CARTO_KEY.
          CARTO="${CARTO_KEY:-$(sed -n "s/.*cartoKey: '\([^']*\)'.*/\1/p" assets/js/config.js)}"
          test -n "$CARTO" || { echo "Clé CARTO introuvable"; exit 1; }
          if [ -n "$API_URL" ]; then
            case "$API_URL" in https://*) ;; *) echo "Adresse de serveur invalide : $API_URL"; exit 1 ;; esac
          fi
          printf 'window.CW_CONFIG = {\n  apiUrl: %s,\n  cartoKey: %s,\n};\n' \
            "$(python3 -c 'import json,os;print(json.dumps(os.environ["API_URL"]))')" \
            "$(CARTO="$CARTO" python3 -c 'import json,os;print(json.dumps(os.environ["CARTO"]))')" \
            > _site/assets/js/config.js
          cat _site/assets/js/config.js
          if [ -n "$API_URL" ]; then echo "Synchronisation branchée sur $API_URL"; else echo "Publié sans synchronisation (pas de secrets Cloudflare)."; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
