# Publie le site sur GitHub Pages à chaque poussée sur `public`.
#
# `enablement: true` active Pages au premier passage : aucun réglage manuel.
# Le dépôt doit être public pour que l'adresse soit accessible sans compte.
name: Publier sur GitHub Pages

on:
  push:
    branches: [public]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier que le site est complet
        run: |
          test -f index.html
          test -f data/paris.json
          test -f data/montpellier.json
          test -f manifest.webmanifest
      - uses: actions/configure-pages@v5
        with:
          # Active GitHub Pages tout seul au premier passage.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
