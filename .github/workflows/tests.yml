# Rejoue les tests de bout en bout à chaque poussée.
name: Tests

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: node tests/smoke.mjs
      - run: node tests/cloud.mjs
      - run: python3 tools/build_single.py && node tests/single.mjs
